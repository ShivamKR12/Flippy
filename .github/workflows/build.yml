name: Build Desktop Executables

on:
  push:
    paths:
      - 'flippy.py'
      - 'flippy.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce

      - name: Build with PyInstaller
        run: pyinstaller flippy.spec

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/flippy.exe -DestinationPath flippy-windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czvf flippy-linux.tar.gz -C dist flippy

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: zip -j flippy-macos.zip dist/flippy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flippy-${{ runner.os }}
          path: |
            flippy-*.zip
            flippy-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Flippy v${{ github.run_number }}
          files: |
            artifacts/flippy-Windows/flippy-windows.zip
            artifacts/flippy-Linux/flippy-linux.tar.gz
            artifacts/flippy-macOS/flippy-macos.zip
